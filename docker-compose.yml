services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: YOUR_POSTGRES_USER
      POSTSTGRES_PASSWORD: YOUR_POSTGRES_PASSWORD
      POSTGRES_DB: YOUR_POSTGRES_DB
    volumes:
      - pgdata:var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      -"5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <postgres_user> -d <YOUR_POSTGRES_DB>"]
      interval: 10s
      timeout: 10s
      retries: 5
    
  api:
    build:
      context:
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: YOUR_DATABASE_URL
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-01234567abcde}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:- ChangeMe123!}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
    

